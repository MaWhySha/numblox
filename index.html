<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Numblox</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="booting">
    <div id="app">
        <!-- PANTALLA MENÚ PRINCIPAL -->
        <div id="menuScreen" class="screen active">
            <div class="menu-content">
                <!-- Cuadro del logo: blanco por defecto, se reemplaza desde el panel del editor -->
                <div id="menuLogo" class="menu-logo" role="img" aria-label="Logo de Numblox"></div>
                <h1 class="game-title">NUMBLOX</h1>
                <p class="subtitle">Aprende matemáticas jugando</p>
                <button class="btn-primary" id="btnPlay" aria-label="Jugar">JUGAR</button>
            </div>
        </div>

        <!-- PANTALLA INTERMEDIA: SELECCIÓN DE MODOS -->
        <div id="modesScreen" class="screen">
            <h2 class="modes-title">ELIGE UN MODO</h2>
            <div class="modes-grid">
                <button class="mode-card" id="btnModeClassic">
                    <span class="mode-icon">🎯</span>
                    <h3>Clásico</h3>
                    <p>Atrapa la respuesta correcta</p>
                </button>
                <button class="mode-card locked" disabled>
                    <span class="mode-icon">⏱️</span>
                    <h3>Contrarreloj</h3>
                    <p>Próximamente</p>
                </button>
                <button class="mode-card locked" disabled>
                    <span class="mode-icon">🏆</span>
                    <h3>Desafío</h3>
                    <p>Próximamente</p>
                </button>
            </div>
            <button class="btn-back" id="btnBackToMenu">← Volver</button>
        </div>

        <!-- PANTALLA INTERMEDIA 2: RITMO DE JUEGO -->
        <div id="difficultyScreen" class="screen">
            <h2 class="modes-title">ELIGE EL RITMO</h2>
            <div class="modes-grid">
                <button class="mode-card" id="btnZen">
                    <span class="mode-icon">🌿</span>
                    <h3>Zen</h3>
                    <p>Ritmo tranquilo y constante</p>
                </button>
                <button class="mode-card" id="btnSpeed">
                    <span class="mode-icon">⚡</span>
                    <h3>Velocidad</h3>
                    <p>Cada vez aparecen más rápido</p>
                </button>
            </div>
            <button class="btn-back" id="btnBackToModes">← Volver</button>
        </div>

        <!-- PANTALLA DE JUEGO (SPLIT-SCREEN) -->
        <div id="gameScreen" class="screen">
            <!-- Izquierda: Zona de físicas y carriles -->
            <div id="gameZone">
                <canvas id="gameCanvas"></canvas>
            </div>

            <!-- Derecha: Panel de estado y matemáticas -->
            <div id="uiPanel">
                <div class="ui-card">
                    <span class="ui-label">VIDAS</span>
                    <div id="heartsRow"></div>
                </div>

                <div class="ui-card">
                    <span class="ui-label">PUNTOS</span>
                    <span id="scoreText">0</span>
                </div>

                <div class="cloud-box">
                    <span class="cloud-label">Encuentra la respuesta:</span>
                    <span id="targetEquation">0 + 0 = ?</span>
                </div>

                <div id="mascotBox">
                    <!-- Aquí irá el sprite de la mascota en el futuro -->
                    <div class="mascot-placeholder">🐾</div>
                </div>
            </div>
        </div>

        <!-- PANEL AL PERDER (su fondo se cambia desde el editor) -->
        <div id="gameOverPanel" class="gameover-overlay" aria-hidden="true">
            <div id="gameOverCard" class="gameover-card" role="dialog" aria-modal="true"
                aria-labelledby="gameOverTitle">
                <h2 id="gameOverTitle">¡Juego terminado!</h2>
                <p id="gameOverScore" class="gameover-score"></p>
                <p id="gameOverDetail" class="gameover-detail"></p>
                <button id="btnGameOverBack" class="gameover-back" type="button">← Regresar</button>
            </div>
        </div>
    </div>

    <!-- INICIAR SESIÓN (arriba a la derecha, visible para todos) -->
    <button id="loginBtn" class="login-btn" type="button">Iniciar sesión</button>

    <!-- VENTANA DE INICIO DE SESIÓN: alumno o administrador -->
    <div id="authModal" class="auth-overlay" aria-hidden="true">
        <div class="auth-card" role="dialog" aria-modal="true" aria-labelledby="authTitle">
            <button id="authClose" class="admin-icon-btn" type="button" aria-label="Cerrar">✕</button>

            <!-- Elegir tipo de acceso -->
            <div id="authChoose">
                <h2 id="authTitle">Iniciar sesión</h2>
                <p class="auth-note">Elige cómo quieres entrar. Se usa tu cuenta de Google.</p>
                <button id="authStudent" class="auth-option" type="button">🎓 Iniciar sesión como alumno</button>
                <button id="authAdmin" class="auth-option plain" type="button">🛠️ Iniciar sesión como
                    administrador</button>
            </div>

            <!-- Sesión iniciada -->
            <div id="authWelcome" hidden>
                <h2 id="authWelcomeTitle"></h2>
                <p id="authWelcomeSub" class="auth-note"></p>
                <button id="authPlay" class="auth-option" type="button">▶ Ir al juego</button>
                <div id="authWelcomeActions"></div>
                <button id="authLogout" class="auth-option plain" type="button">Cerrar sesión</button>
            </div>

            <p id="authMsg" class="auth-msg" role="alert"></p>
        </div>
    </div>

    <!-- El panel del editor NO está en esta página: se construye aquí solo para el administrador verificado -->
    <div id="editorRoot"></div>

    <script>
        // Diagnóstico: si el juego no arranca en 5 s, muestra qué revisar en lugar de una pantalla vacía
        (function () {
            var lastError = '';
            window.addEventListener('error', function (e) { lastError = e.message || ''; });
            window.addEventListener('unhandledrejection', function (e) {
                lastError = (e.reason && e.reason.message) || String(e.reason || '');
            });
            setTimeout(function () {
                if (window.__numbloxReady) return;
                document.body.classList.remove('booting');
                var box = document.createElement('pre');
                box.style.cssText = 'position:fixed;inset:0;z-index:2000;margin:0;padding:16px;overflow:auto;' +
                    'white-space:pre-wrap;color:#fff;background:#7a1020;font:14px monospace;user-select:text';
                box.textContent = 'El juego no pudo iniciar.\n\n' + (lastError ? 'Error: ' + lastError + '\n\n' : '') +
                    'Revisa que la carpeta js/ del repositorio tenga estos 6 archivos (en minúsculas):\n' +
                    'config.js, firebase.js, game.js, assets.js, panel.js, image-utils.js\n\n' +
                    'Luego recarga sin caché (Ctrl+F5).';
                document.body.appendChild(box);
            }, 5000);
        })();
    </script>
    <script type="module" src="js/game.js"></script>
</body>

</html>
